plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Motor de ejecución y pruebas (JUnit 5)
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    // Módulo extra para agrupar pruebas (Suite)
    testImplementation 'org.junit.platform:junit-platform-suite:1.10.2'

    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'

    // Herramienta de automatización web (Selenium 4)
    implementation 'org.seleniumhq.selenium:selenium-java:4.18.1'

    // BDD y Cucumber
    testImplementation 'io.cucumber:cucumber-java:7.15.0'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.15.0'
}

test {
    useJUnitPlatform()

    // Esta configuración extra te ayudará a ver en la consola si las pruebas pasan o fallan
    testLogging {
        events "passed", "skipped", "failed"
    }
}